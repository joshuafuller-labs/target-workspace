site_name: Target Workspace
site_description: Configurable kanban for the target lifecycle. CoT-native, plugin-driven, malleable.
site_url: ""  # private repo; no public hosting until license decision
docs_dir: docs
repo_url: https://github.com/joshuafuller-labs/target-workspace
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle: { icon: material/brightness-7, name: dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle: { icon: material/brightness-4, name: light mode }

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Tech stack: tech-stack.md
  - Foundation: foundation.md
  - Design:
      - v0.1: design/v0.1-design.md
  - Research:
