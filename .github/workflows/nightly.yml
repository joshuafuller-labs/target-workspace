name: Nightly

# Runs daily at 02:00 UTC. Mutation testing, license re-audit, dep-tree drift check.
# Long-running jobs that don't belong on every PR.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # for opening drift / mutation alerts

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation testing (mutmut)
    runs-on: arc-homelab-runner
    timeout-minutes: 60

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync
        run: uv sync --all-extras --dev --frozen

      - name: Run mutmut
        run: uv run mutmut run --paths-to-mutate src/ || true
        # mutmut returns non-zero when mutants survive — we capture results below
        # but don't fail the schedule run on partial kill rate

      - name: Mutation report
        if: always()
        run: uv run mutmut results || true

  slow-tests:
    name: Slow tests (revert-fail + mutation-kill audits)
    runs-on: arc-homelab-runner
    timeout-minutes: 60

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0   # revert-fail audit checks out historical commits

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync
        run: uv sync --all-extras --dev --frozen

      - name: Slow-marked tests (mutmut kill-rate + git-revert TDD audits)
        run: uv run pytest -m slow --no-cov -q

  license-reaudit:
    name: License re-audit
    runs-on: arc-homelab-runner
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"

      - name: Install + audit
        run: |
          uv python install 3.13
          uv sync --all-extras --dev --frozen
          uv run pip-licenses --format=json --with-license-file \
            --fail-on="GPL-2.0;GPL-3.0;AGPL-3.0;SSPL;UNKNOWN" > licenses.json

      - name: Upload license report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licenses-${{ github.run_id }}
          path: licenses.json
          retention-days: 90

  scorecard:
    name: OSSF Scorecard
    runs-on: arc-homelab-runner
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      id-token: write
      security-events: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false  # private repo
