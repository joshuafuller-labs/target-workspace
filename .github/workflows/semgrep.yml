name: Semgrep (SAST)

# Replaces CodeQL. GitHub code-scanning requires Advanced Security, which isn't
# available on this private repo in a free org (POST /code-scanning → 403). Semgrep
# runs fully self-contained — no SARIF upload, no GHAS — and blocks the build on
# ERROR-severity findings. Reviewed exceptions are marked inline with `# nosemgrep`.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: arc-homelab-runner
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"

      # Blocking SAST on ERROR-severity findings only (high confidence/severity),
      # across the Python backend and the TS frontend source.
      - name: Semgrep SAST
        run: >-
          uvx --from "semgrep==1.163.0" semgrep scan
          --config p/security-audit
          --config p/secrets
          --config p/owasp-top-ten
          --severity ERROR
          --error
          --quiet
          src frontend/src
