name: Semgrep (SAST)

# Replaces CodeQL. GitHub code-scanning requires Advanced Security, which isn't
# available on this private repo in a free org (POST /code-scanning → 403). Semgrep
# runs fully self-contained — no SARIF upload, no GHAS — and blocks the build on
# ERROR-severity findings. Reviewed exceptions are marked inline with `# nosemgrep`.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: arc-homelab-runner
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.14"

      # Blocking SAST on ERROR-severity findings only (high confidence/severity),
      # across the Python backend and the TS frontend source.
      - name: Semgrep SAST
        run: >-
          uvx --from "semgrep==1.163.0" semgrep scan
          --config p/security-audit
          --config p/secrets
          --config p/owasp-top-ten
          --severity ERROR
          --error
          --quiet
          src frontend/src
