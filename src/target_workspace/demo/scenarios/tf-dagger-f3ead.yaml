# TF DAGGER — F3EAD targeting cycle
# Populated workspace mirroring the DoD Tactical mockup. Sample data only.
#
# Carries a mix of ground targets (a-h-G-*) and Counter-UAS air targets
# (a-h-A-*) — F3EAD is a generic targeting cycle; same engine processes
# both, just different CoT affiliation + payload-shape custom fields.
# Demonstrates that "C-UAS" is not a separate workflow, it's the same
# Find/Fix/Finish/Exploit/Analyze/Disseminate applied to small-UAS
# contacts.

name: "TF DAGGER F3EAD"
workspace_name: "TF DAGGER"

board:
  name: "F3EAD"
  transitions: unrestricted
  theme: tactical
  columns:
    - { name: FIND,    order: 0 }
    - { name: FIX,     order: 1 }
    - { name: FINISH,  order: 2, requires_approval: true }
    - { name: EXPLOIT, order: 3 }
    - { name: ANALYZE, order: 4 }
    - { name: DISSEM,  order: 5 }

publishers:
  - name: "raw CoT (multicast)"
    plugin_type: raw_cot
    adapter_config: { transport: udp, host: 239.2.3.1, port: 6969 }
    column_filter_names: [DISSEM]

targets:
  # --- FIND (3 fresh cues) ---
  - name: BISON-01
    column_name: FIND
    cot_type: a-h-G-E-V
    lat: 38.85912
    lon: -105.04188
    ce: 18
    confidence: 0.87
    minutes_ago: 2
    custom_fields:
      jiptl_priority: 18
      source: CV-ATR (MQ-9)
      sources: 1
      grade: B2

  - name: VIPER-23
    column_name: FIND
    cot_type: a-h-G-U-C
    lat: 38.85970
    lon: -105.04420
    ce: 35
    confidence: 0.62
    minutes_ago: 7
    custom_fields:
      jiptl_priority: 22
      source: HUMINT (HCT-7)
      grade: C3

  - name: HORNET-04
    column_name: FIND
    cot_type: a-u-G-I
    lat: 38.85412
    lon: -105.03988
    ce: 8
    confidence: 0.71
    minutes_ago: 22
    custom_fields:
      jiptl_priority: 27
      source: GEOINT (NGA 24h delta)

  # C-UAS: raw radar return on a small unmanned air contact entering the
  # AO. UAS Group-1 candidate; not yet correlated with other sensors.
  - name: KITE-22
    column_name: FIND
    cot_type: a-u-A
    lat: 38.85988
    lon: -105.04550
    hae: 122
    ce: 14
    confidence: 0.63
    minutes_ago: 3
    custom_fields:
      domain: air
      uas_group: 1
      sensor: "Ku-band radar"
      rcs_m2: 0.04
      alt_agl_m: 118
      heading_deg: 092
      speed_kt: 24
      iff: "no transponder"

  # EW: line-of-bearing from a single RF DF collector. Ellipse models the
  # uncertainty cone — wide cross-bearing (300m), narrow along-bearing
  # (1500m), rotated to the major-axis bearing. This is the canonical
  # "single-sensor LOB" geometry; flagged as `bearing-only` so RoE gates
  # against kinetic engagement until corroborated.
  - name: DF-LOB-04
    column_name: FIND
    cot_type: a-u-A
    lat: 38.85600
    lon: -105.04200
    hae: null
    minutes_ago: 5
    geometry_kind: ellipse
    geometry_quality: bearing-only
    ellipse:
      semi_major_m: 1500
      semi_minor_m: 300
      bearing_deg: 87
    custom_fields:
      sensor: "RF DF · single collector"
      rf_band: "433 MHz"
      collector: "RF-COL-NE"
      lob_truth_basis: "1-sigma uncertainty"

  # --- FIX (3 corroborated) ---
  - name: COBRA-12
    column_name: FIX
    cot_type: a-h-G-E-V-C
    lat: 38.85620
    lon: -105.04150
    ce: 12
    le: 18
    confidence: 0.91
    minutes_ago: 18
