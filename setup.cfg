[mutmut]
# TDD audit step 2 — mutation testing. Scoped narrow (rbac.py, 68 LOC)
# to validate the harness, then expanded. pyproject.toml's pytest
# addopts add coverage flags + --cov-fail-under=85; those would mark
# every mutant "failed" for coverage reasons instead of test reasons.
# pytest_add_cli_args injects -o addopts="" + --no-cov so each mutant
# run is measured only by the test outcome.
paths_to_mutate = src/target_workspace/api/rbac.py
tests_dir = tests/integration/test_rbac.py
pytest_add_cli_args =
    -o
    addopts=
    --no-cov
    -p
    no:cacheprovider
