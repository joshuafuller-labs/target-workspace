# Alembic config — see https://alembic.sqlalchemy.org/en/latest/tutorial.html
#
# The database URL is overridden at runtime from TW_DATABASE_URL via
# migrations/env.py — this file is mostly format/logging concerns.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
sqlalchemy.url =

# black-style 88 columns for generated revisions.
truncate_slug_length = 40
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
